[project]
name = "rok-assistant"
version = "0.1.0"
description = "Rise of Kingdoms rally automation tool"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.5",
    "opencv-python>=4.8",
    # 检测：YOLO 权重以 ONNX 形式运行，推理后端是 onnxruntime（CPU）。
    # torch / ultralytics 只在训练与导出时需要，见 [train]。
    "onnxruntime>=1.17",
    # 生产 OCR 引擎（py3.14 下 paddlepaddle 无 wheel，改用 PP-OCR 的 ONNX 封装，
    # 模型随 wheel 离线分发）
    "rapidocr-onnxruntime>=1.3",
    "pyyaml>=6.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
# 训练 / 导出权重用。运行发行包不需要其中任何一项。
train = [
    "ultralytics>=8.0",
    "onnx>=1.16",
    "onnxslim>=0.1.82",       # exporter 的 simplify=True 走它
    "paddleocr>=2.7",         # 仅 OCRText 的 legacy 兜底路径，生产走 rapidocr
]
# 打绿色包用。
build = [
    "pyinstaller>=6.16",      # Python 3.14 需要 >=6.16
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-qt>=4.4",
]

[project.scripts]
rok-assistant = "rok_assistant.gui.main_window:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=./.pytest_tmp"
markers = [
    "integration: requires recorded screenshots",
    "slow: takes more than 1 second",
]
