# preset_1..6（2026-09-24 重定）：六个 44x44 图标只差中间一个小数字，靠位置
# 区分不了槽位。**2026-09-27 更正**：当初写的「面板会整体上下移约 80px」是
# 错的——那是标注被顶部菱形（见文件末 pixel_stats 一节）污染后反推出来的假象。
# 逐像素实测 44 帧：槽位钉死在 cy 474+82*(N-1)，`march_btn` cy=925、
# `form_title` cy=69 逐字节不变，面板根本不移动。下面这条宽 ROI 保留，
# 因为它对「槽位固定」同样够用，且不宜在同一次改动里动两个变量。真正的
# 槽位判别仍只靠数字字形，所以：
#   1) 六个槽共用一条覆盖整列的 ROI（x 1600-1712 / y 350-930），
#      把判别权完全交给 minMaxLoc 最优匹配；
#   2) 阈值抬到 0.97。实测全库 780 帧：最优匹配落在正确槽位时分数 >=0.9935，
#      串到邻槽最高只到 0.9616 —— 0.9 会把串位全放行。
# 旧配置（每槽 100px 窗 + 0.9）的实测代价：25 条被窗裁掉（面板偏高的帧上
# 模板腿与 YOLO 兜底腿一起静默失效）、串位无拦截。串位不是小事——
# leader_sm._form_troop 是直接点匹配位置（`self._click(f"preset_{N}")`），
# 点错槽 = 派错兵。
# 新配置实测：正确 394 条 / 串位 0 条 / 无标注帧误报 0 条。
# YOLO 腿（2026-10-04 起与模板阈值解耦，单独用 yolo_threshold）：**显式关闭**。
# 定标实测 preset_1..6 在 val 的 5~6 个正样本帧上 YOLO conf 最小 0.000
# （640 输入下图标约 15px，模型读不出槽位数字），而模板给 0.44~0.93。让它
# 先行只会点错槽 = 派错兵——宁可让模板失配（_click 空操作）也不点错。
# 1.01 是「任何 conf 都够不到」的哨兵值。
