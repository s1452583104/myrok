# ---- 宝石模式（2026-10-17）----
# ROI 是**搜索区**（live 截图里的裁切范围），要含元素真实位置 + 漂移余量；
# 模板必须装得进 ROI，否则 cv2.matchTemplate 断言失败 → 抛异常 → runner
# 攒满 6 次停机（锚点测试：tests/unit/core/test_gem_manifest.py）。
#
# 阈值标定（Task 2.4，2026-10-17；gem_icon 经 fix round 1 修正）：对 imgs/gem 的 11 帧跑
# `_probe_gem_threshold.py`（ROI 内 cv2.matchTemplate TM_CCOEFF_NORMED 取 max）。规则：
#   hi = **正样本帧的最低分**，lo = **负样本帧的最高分**；
#   threshold = max(midpoint(lo, hi), 0.80)；hi - lo < 0.15 判该条不可靠。
# 其余 5 条（gem_mine_zoom / view_radial_menu / view_btn_resource / collect_dialog /
# collect_btn）正样本都近 1.000、负样本最高都 <= 0.45，中点全落在 0.80 下限之下，
# 故**这五条回填 0.80**（0.80 高于全部负样本最高分，余量充足）。
# **gem_icon 例外，回填 0.77**：其约束来自地图帧上最像的干扰项（白色「C」圆环，
# lo = 0.752 @142720）与最弱正样本（hi = 0.796 @142725），可用带 [0.752, 0.796] 的
# 中点 0.774 向下取 0.77——0.80 下限会漏 142725。详见该条注释与 task-2.4-report.md。
# 资源查看视角里的宝石资源图标（白色六边形晶体，44x34）。
# ROI 覆盖地图主体、避开顶部 HUD / 底部按钮栏 / 右侧队列栏。
#
# 阈值 **0.77**（不是 0.80 下限）——修正 2.4 首轮的「不可靠」结论：
#   首轮把 lo 取成 0.731 @142757，但 142757 是 **UI 屏、不是地图**（其 top-1 是蓝色
#   圆角 UI 矩形，与宝石无关），不构成约束。用 `_probe_gem_icon_margin.py` 摊开每帧
#   top-2（联络表 recordings/gem_probe/gem_icon_margin_sheet.png）后：
#     * 5 张地图帧（142653/142658/142707/142720/142725）的 top-1 **都是宝石**；
#     * top-2 都是**白色「C」圆环图标**（像计时/采集徽章），地图帧上最高
#       **0.752 @142720**（142707 上 0.751）→ 真正的 lo = 0.752；
#     * 最弱正样本 hi = **0.796 @142725**（该帧 top-1 确为宝石，只是背后地形偏金褐）。
#   可用带 [0.752, 0.796]，中点 0.774 → **向下取 0.77（偏向召回）**：这里误报会被
#   下游双确认兜住（放大 → gem_mine_zoom → gem_dialog_title OCR；ZOOM_CONFIRM 在
#   zoom_verdict == retry 时回 SCAN），而漏检是静默且永久的——142725 正是用户点名的
#   必检帧，0.80 会漏它。
#   **该带只有 0.044 宽**，跨账号/跨缩放级别很脆；Stage 5 的 YOLO 第二条腿是计划中的
#   召回补救，Task 5.6 必须重定此值。
- id: gem_icon
  file: gem_icon.png
  type: template_match
  roi:
  - 0
  - 90
  - 1620
  - 900
  threshold: 0.77
  # 占位：gem 类尚未进 YOLO 模型（Stage 5 重训后才挂第二条腿），0.5 = registry
  # 默认值，当前空转。重训后按 tools/calibrate_yolo_threshold.py 的读数回填，
  # 别当成已标定值。
  yolo_threshold: 0.5
# 点开宝石后放大画面里的矿体（142730）。模板 190x168。
# 实测：正仅 142730=1.000（hi），负最高 142802=0.398（lo）。中点 0.699 → 0.80 下限。
- id: gem_mine_zoom
  file: gem_mine_zoom.png
  type: template_match
  roi:
  - 300
  - 150
  - 1620
  - 950
  threshold: 0.80
# 长按地图按钮后弹出的环形菜单（142653）。模板 296x428，源帧矩形 x204-500 /
# y650-1078。ROI 右边界**从 500 放宽到 540**：500 正好是元素的右边界，零漂移
# 余量——菜单右移 1px 就贴边裁掉。
# 实测：正**仅 142653 一帧**=1.000（hi，正样本单薄），负最高 142730=0.238（lo）。
# 中点 0.619 → 0.80 下限。其余 10 帧非本菜单形态，负样本足够。
- id: view_radial_menu
  file: view_radial_menu.png
  type: template_match
  roi:
  - 0
  - 600
  - 540
  - 1080
  threshold: 0.80
# 环形菜单里的「资源」按钮（142653 的 (428,822)）。模板 128x128。
# 实测：正**仅 142653 一帧**=1.000（hi，正样本单薄），负最高 142725=0.450（lo）。
# 中点 0.725 → 0.80 下限。
- id: view_btn_resource
  file: view_btn_resource.png
  type: template_match
  roi:
  - 300
  - 700
  - 560
  - 950
  threshold: 0.80
# 采集框整块面板（142743）。模板 700x520，源帧矩形 x739-1439 / y273-793。
# ROI **从 720x480 放大到 800x600**：原来的高 480 装不下 520 的模板，
# cv2.matchTemplate 会断言失败抛 cv2.error（锚点测试 test_gem_template_fits_inside_its_roi
# 就是为这个加的）。**模板里没有角色头像**（fix round 1 核实）：会随账号/资源变的是
# **文本**——坐标 `X:349 Y:35`、`等级3` 的数字、`储量 30` 的数字、`采集者`/`所属联盟`
# 的值，约占裁剪面积 2%。**不缩到「恒定子区」重裁**：那会一并丢掉给出判别力的红宝石
# 与蓝按钮结构，且手上没有第二张采集框帧来验证这个取舍。Stage 5 负责重裁（欠账保留）。
# 实测：正**仅 142743 一帧**=1.000（hi，正样本单薄），负最高 142730=0.254（lo）。
# 中点 0.627 → 0.80 下限。
- id: collect_dialog
  file: collect_dialog.png
  type: template_match
  roi:
  - 700
  - 240
  - 1500
  - 840
  threshold: 0.80
# 采集框上的蓝色「采集」按钮（142743 的 (1060,724)）。模板 320x124，源帧矩形
# x928-1248 / y664-788。ROI **从 320x130 放大到 420x210**：原宽 320 与模板
# 等宽（只剩一个滑动位）、右边界 1220 又落在按钮内（按钮到 1248），等于拿
# 模板去比**错位的像素**、分数必然低。
# 实测：正**仅 142743 一帧**=1.000（hi，正样本单薄），负最高 142730=0.251（lo）。
# 中点 0.626 → 0.80 下限。
- id: collect_btn
  file: collect_btn.png
  type: template_match
  roi:
  - 880
  - 620
  - 1300
  - 830
  threshold: 0.80

# ===========================================================================
# pixel_stats —— 像素统计判据（**刻意不放进 templates:**）
#
# 为什么不放进 templates: 那一节会被 auto_label_yolo.py / ingest_raw_imgs.py /
# measure_preset_roi.py / relabel_extra_classes.py **逐个 cv2.imread(spec.file)**：
#   * 缺 file -> TemplateRegistry.load 的 `entry["file"]` 直接 KeyError；
#   * 假 file -> auto_label_yolo 抛 FileNotFoundError 整个工具挂掉；
#   * 真 file -> 为一个 dataset.yaml 里不存在的类生成框 = 注入垃圾框
#     （正是这几轮一直在清的污染模式）。
# 放成独立顶层小节，registry._t 一字不动，上述四个工具与
# tests/unit/core/test_preset_roi_anchor.py **零影响**。
#
# 几何/阈值全在 src/rok_assistant/core/recognizers/pixel_stat.py 的常量里
# （单一真相，预览与运行时共用同一份，不可能漂移）。这里只声明 id 与 kind。
#
# 判据实测（44 帧，见 docs/PROGRESS.md）：
#   frac = mean(槽心±22px 的 max(BGR) > 200)
#   选中槽 0.72~0.75 / 未选中 0.07~0.09 —— 8~10 倍余量，argmax 41/44
# 两个陷阱（回归测试锚定）：
#   * 顶部菱形 cy≈389 恒亮 frac 0.80（比任何选中槽都亮），恰在槽 1 上方一个
#     槽距——从 y=391 起扫就会把它当成槽 1。slot_centers() 从 474 起，永不取样。
#   * 第 7 槽 cy=966 真实存在（6 帧选中它），所以扫 7 格，但只给 1..6 装识别器。
pixel_stats:
- id: selected_preset_1
  kind: preset_slot
- id: selected_preset_2
  kind: preset_slot
- id: selected_preset_3
  kind: preset_slot
- id: selected_preset_4
  kind: preset_slot
- id: selected_preset_5
  kind: preset_slot
- id: selected_preset_6
  kind: preset_slot

# 面板上的文本字段：固定 ROI + OCR + 整块正则（见 core/recognizers/text_field.py）。
# 与 `templates:` / `pixel_stats:` 并列，不进 `templates:`——它没有模板图，
# 进去会让 entry["file"] KeyError，或被标注工具 cv2.imread 后注入垃圾框。
text_fields:
- id: fortress_level
  roi: [100, 470, 1040, 620]
  # 必须整块匹配。面板里另有「推荐兵力：1,400,000等级4的战斗单位集结进攻」
  # 这类含「等级」的长句，子串匹配会锚错对象——这正是那次标注污染的成因
  # （见 tools/fix_zhaizi_level_labels.py 的 docstring）。
  pattern: '^等级\s*[：:]\s*(\d+)$'
# 采集框的标题行（142743）。**2026-10-17 本机重测**（Task 2.4，RapidOCR 跑
# 本 ROI）：OCR 块「宝石矿床」实测 bbox (1076,355)-(1236,404)、conf 0.785；
# 同帧另读出一块「等级3」(978,355)-(1089,406) conf 0.749。旧注释写的
# (990,356)-(1224,395) 是估计值，已按实测改。
# 用来把「宝石矿床」和其它资源（木材/粮食/铁矿/石料）区分开：图标能认出
# 「是个资源」，只有这行字能认出「是宝石」——双确认的第二腿（Task 3.6）。
#
# 两个坑（都不靠 OCR 就能验，锚点测试 test_gem_manifest.py 盯着）：
#   * `TextFieldRecognizer` 是 **fullmatch**，不是子串查找（见 text_field.py）。
#     所以 pattern 不能写成裸的 `宝石`——那对不上整块「宝石矿床」，判据永远
#     miss，采集框出来也会被当成别的资源关掉。这里用 `.*宝石.*`：既保留
#     brief「在这一行里找它」的本意，又容忍 OCR 在「矿床」上的噪声（实测
#     紧裁时会读成「宝石矿庆」），且木材/粮食/铁矿/石料的标题都不含「宝石」，
#     不会因此误报。
#   * `recognize` 取 `m.group(1)` 当 value——pattern **必须恰好一个捕获组**，
#     否则真匹配上时抛 IndexError（异常冒到 action → runner 6 次停机）。
- id: gem_dialog_title
  roi: [930, 355, 1300, 410]
  pattern: '(.*宝石.*)'
