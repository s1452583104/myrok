# ===========================================================================
# pixel_stats —— 像素统计判据（**刻意不放进 templates:**）
#
# 为什么不放进 templates: 那一节会被 auto_label_yolo.py / ingest_raw_imgs.py /
# measure_preset_roi.py / relabel_extra_classes.py **逐个 cv2.imread(spec.file)**：
#   * 缺 file -> TemplateRegistry.load 的 `entry["file"]` 直接 KeyError；
#   * 假 file -> auto_label_yolo 抛 FileNotFoundError 整个工具挂掉；
#   * 真 file -> 为一个 dataset.yaml 里不存在的类生成框 = 注入垃圾框
#     （正是这几轮一直在清的污染模式）。
# 放成独立顶层小节，registry._t 一字不动，上述四个工具与
# tests/unit/core/test_preset_roi_anchor.py **零影响**。
#
# 几何/阈值全在 src/rok_assistant/core/recognizers/pixel_stat.py 的常量里
# （单一真相，预览与运行时共用同一份，不可能漂移）。这里只声明 id 与 kind。
#
# 判据实测（44 帧，见 docs/PROGRESS.md）：
#   frac = mean(槽心±22px 的 max(BGR) > 200)
#   选中槽 0.72~0.75 / 未选中 0.07~0.09 —— 8~10 倍余量，argmax 41/44
# 两个陷阱（回归测试锚定）：
#   * 顶部菱形 cy≈389 恒亮 frac 0.80（比任何选中槽都亮），恰在槽 1 上方一个
#     槽距——从 y=391 起扫就会把它当成槽 1。slot_centers() 从 474 起，永不取样。
#   * 第 7 槽 cy=966 真实存在（6 帧选中它），所以扫 7 格，但只给 1..6 装识别器。
pixel_stats:
- id: selected_preset_1
  kind: preset_slot
- id: selected_preset_2
  kind: preset_slot
- id: selected_preset_3
  kind: preset_slot
- id: selected_preset_4
  kind: preset_slot
- id: selected_preset_5
  kind: preset_slot
- id: selected_preset_6
  kind: preset_slot

# 面板上的文本字段：固定 ROI + OCR + 整块正则（见 core/recognizers/text_field.py）。
# 与 `templates:` / `pixel_stats:` 并列，不进 `templates:`——它没有模板图，
# 进去会让 entry["file"] KeyError，或被标注工具 cv2.imread 后注入垃圾框。
text_fields:
- id: fortress_level
  roi: [100, 470, 1040, 620]
  # 必须整块匹配。面板里另有「推荐兵力：1,400,000等级4的战斗单位集结进攻」
  # 这类含「等级」的长句，子串匹配会锚错对象——这正是那次标注污染的成因
  # （见 tools/fix_zhaizi_level_labels.py 的 docstring）。
  pattern: '^等级\s*[：:]\s*(\d+)$'
