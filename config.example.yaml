# rok-assistant 配置示例
#
# 绿色包首次启动时，若同目录下没有 config.yaml，会自动复制本文件生成一份，
# 并尝试自动探测 MuMu/adb 的安装路径填进去。之后请用 GUI 配置：
#   「⚙ 配置」按钮 → 改完保存
# 手动编辑后校验：
#   .venv/Scripts/python.exe -c "from rok_assistant.infra.config import load_config; from pathlib import Path; print(load_config(Path('config.yaml')))"
#
# 面向非程序员的逐步说明见 docs/配置说明.md（连不上模拟器先看那一份）。

app:
  screen_width: 1920        # 模板按 1920x1080 中文 UI 采集，勿改
  screen_height: 1080       # 必须和模拟器分辨率一致，否则点击坐标全部错位
  locale: zh-CN             # 游戏界面语言；模板与检测模型都按中文采集，勿改
  # 角色卡片显示模式。主界面页头的「文字模式 / 图文模式」开关改的就是这一行，
  # 手改也行（保存后点「刷新配置」）。
  #   image = 图文：截屏缩略图 + 日志
  #   text  = 文字：不展示截屏，卡片变矮，一屏能放更多卡（多开模拟器时更好用）
  card_view: image
  # 留空 = 首启自动探测；探测不到就点「⚙ 配置」里的「自动检测 MuMu/adb 路径」
  # 或手动填 MuMu 安装目录下的 MuMuManager.exe / adb.exe
  mumu_manager_path: ""
  adb_path: ""
  # 检测模型（ONNX，运行时只认 .onnx，torch 不进发行包）。
  # 换权重：先 tools/export_onnx.py 导出，再 tools/calibrate_yolo_threshold.py 复核阈值
  yolo_model: models/detect.onnx
  # fill_<名字> 模板未命中时用 OCR 认名字兜底
  ocr_name_fallback: true
  max_rounds: 10                 # 每角色最多完成多少轮（开集结+填兵+返城）后自动收工
  max_consecutive_failures: 3    # 连续 N 轮失败（或 2N 次 step 异常，疑似体力耗尽）自动收工
  # 反检测随机化。目的：让点击的坐标/节奏不完全一致，不像脚本。
  anti_detection:
    click_offset_px: 8      # 点击散布的默认 σ（高斯，裁剪到 ±3σ）；0 = 点得完全准
    action_delay_min: 0.1   # 每次点击前延迟的下限（秒）
    action_delay_max: 0.5   # 上限。区间内按 delay_shape 采样，不是均匀铺满
    state_delay_min: 0.6    # 轮询间隔下限（秒）。别低于 0.5：每次轮询要截一帧，
    state_delay_max: 1.6    # 单次 adb 截图 150~300ms，太密会把 adb 队列打爆
    jitter_ratio: 0.3       # 硬编码固定等待（如补体力后的 1.5s）的抖动比例
    debug_no_jitter: false  # 改 true = 关闭全部随机化（调试时看真实点击坐标）
    delay_shape: beta       # beta = 偏短带长尾（像人）；uniform = 均匀（旧行为）
    burst_prob: 0.3         # 走「连点」短间隔的概率
    burst_scale: 0.25       # 连点间隔 = min + (max-min) * U(0, 此值)
    rapid_click_min: 0.35   # 连点段（等级 +/- 连着点）间隔下限（秒）；低于 09-11
                            # 实测安全值 0.4s（0.4s 连点 19 次零丢失）→ 真机需确认不丢点击
    rapid_click_max: 0.8    # 上限。与 action_delay 独立
    anchor_sigma:           # 按目标覆盖散布 σ；缺省用 click_offset_px
      preset_slot: 3
      map_center: 4         # 劫掠者城寨搜完后点「屏幕正中心」开详情面板那一下：
                            # 目标是地图正中的城寨图标，偏移大了会点到旁边的空地
    member_response_delay_min: 10.0   # 成员号收到集结事件后延迟多久响应（秒）。
    member_response_delay_max: 60.0   # 两号同机、永远成对出现是强关联信号，错开它。
                                      # 0/0 = 关闭（默认关闭）

# 1 个「模拟器」= 1 个游戏账号 = 1 组角色（同一模拟器多账号切换暂不支持）
# 接入方式二选一：按模拟器选择（推荐，在界面里点「扫描模拟器」按名字选）
# 或手动填 adb 地址（非 MuMu 的模拟器走这条）
#
# 首启默认给两台模拟器、每台一个角色：mumu0 = 车头「集结手」，
# mumu1 = 填兵号「填兵号」。按你自己的机器改——模拟器台数、
# 角色名（必须和游戏内显示名一致）、目标等级 / 预设 / 兵种。
zhaiduo:
  instances:
    - id: mumu0              # 自动生成的内部标识，不用改（跨模拟器填兵时靠它引用）
      name: "模拟器0"        # 显示名，随便起；界面上用这个认机器
      mumu_index: 0          # MuMu 里的模拟器编号；在界面上按名字选，不用手填
      characters:
        # 整个配置至少 1 个 leader/either（member-only 模拟器合法，可跨模拟器填兵）；
        # 同一个模拟器内角色名不能重复。name 必须和游戏内显示名一致（OCR 验证用）。
        - id: char_leader
          name: "集结手"           # ← 改成你的游戏内显示名
          role: leader            # leader=车头 | member=成员 | either=车头或成员
          # 有序搜索列表，最多 3 个、1-15 且不重复。顺序完全自由（6→4→5 合法）：
          # 从第一个开始搜，每级连搜 5 次无结果就换下一个，绕完一圈放弃本轮。
          # 1-10 与 11-15 是**两个互斥的区间**（区间由账号所在大地图决定，
          # 程序不需要切换），同一次搜索不能混选。
          # 活动期间另有「劫掠者寨子」（不分等级的特殊寨子）：写成 target_levels: [0]，
          # **只能单独一项**，不能和等级混着写
          target_levels: [7, 6, 5]
          march_preset: 1         # 组建部队弹窗里的预设槽位，1-5
          march_troop_types: [infantry]   # 可选 infantry(步兵) / cavalry(骑兵) / archer(弓兵)，可多选

    - id: mumu1              # 第二台模拟器（MuMu 里多开的那一台）
      name: "模拟器1"        # 显示名，随便起
      mumu_index: 1          # MuMu 里的模拟器编号；在界面上按名字选，不用手填
      characters:
        - id: char_member
          name: "填兵号"           # ← 改成你的游戏内显示名
          role: member
          target_levels: [7]      # member 不开车，这一项不影响行为，但必填
          march_preset: 1
          march_troop_types: [infantry]
          fill_target_leaders:    # member/either 必填；leader 不能填
            - { instance: mumu0, name: "集结手" }   # instance 填车头所在的 id，name 填车头角色名
# 宝石模式：一台模拟器一个号，长按地图按钮进资源查看视角，螺旋扫图找宝石，
# 派兵采集直到右侧队列满，等一段时间再来一轮。面向非程序员的说明见
# docs/配置说明.md 的「宝石模式」一节。
gem:
  queue_limit: 5        # 队列图标数 >= 这个值就算派满了，去等（1-7）
  max_rounds: 10        # 扫图会话轮数上限，跑满自动收工
  scan_rings: 3         # 回字形向外扩几圈（圈越多扫得越全、一轮越久）
  scan_drag_px: 800     # 每步拖拽距离（像素）
  scan_drag_ms: 500     # 每步拖拽时长（毫秒）
  idle_wait_min: 20     # 队列满后的等待下限（分钟）
  idle_wait_max: 30     # 上限
  instances: []
    # 要跑宝石模式时按下面这样填（一台模拟器一个角色，多台就多几项）：
    # - id: mumu0
    #   name: "宝石号"
    #   mumu_index: 0
    #   characters:
    #     - id: gem1
    #       name: "宝石号"     # ← 必须和游戏内显示名一致
# 答题模式：自动进「知识问答」活动，OCR 认题 → 随包题库 / 大模型 / 随机 作答，
# 答完从绿色高亮反推正确答案写回学习题库，答到活动结束算一轮。
# 面向非程序员的说明见 docs/配置说明.md 的「答题模式」一节。
quiz:
  # 一天只能答一次（无法重复答）：答满一轮即自动收工，没有轮数/冷却配置
  fuzzy_threshold: 0.72      # 题库模糊匹配阈值（越高越严格）
  verify_delay: 1.2          # 点完选项后等多久再截图看绿色（秒）
  min_green_ratio: 0.55      # 选项里绿色像素占比达到多少算「正确答案」
  parse_retries: 2           # 题干/选项认不出来时原地重认几次
  auto_click: true           # false = 只判不点（半自动，建议先这样验一遍）
  entry_taps: []             # 从地图进答题界面的额外点击点 [[x, y], ...]；
                             # 空 = 只靠屏幕上的「进入 / 习题演练 / 活动」文字导航。
                             # 走不通时先用 tools/quiz_entry_probe.py 在真机探一次
  llm:                       # 题库里没有时才用；关掉=纯题库，未命中就随机选
    enabled: false
    base_url: "https://api.deepseek.com/v1"   # OpenAI 兼容地址
    model: "deepseek-chat"
    api_key: ""              # 留空 = 不调大模型
    timeout_s: 8.0
  instances: []
    # 要跑答题模式时按下面这样填（一台模拟器一个角色，多台就多几项）：
    # - id: mumu0
    #   name: "答题号"
    #   mumu_index: 0
    #   characters:
    #     - id: q1
    #       name: "答题号"     # ← 必须和游戏内显示名一致
